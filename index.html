<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head> <script src="script.js"></script>
<body>
  <div class="calculator">
    <div class="display">
      <div class="previous-operand" id="previous-operand"></div>
      <div class="current-operand" id="current-operand">0</div>
    </div>
    <div class="buttons">
      <button class="btn" data-action="clear">AC</button>
      <button class="btn" data-action="delete">DEL</button>
      <button class="btn function" data-action="percent">%</button>
      <button class="btn operator" data-action="divide">÷</button>

      <button class="btn function" data-action="square">x²</button>
      <button class="btn function" data-action="sqrt">√x</button>
      <button class="btn function" data-action="negate">±</button>
      <button class="btn operator" data-action="multiply">×</button>

      <button class="btn" data-number>7</button>
      <button class="btn" data-number>8</button>
      <button class="btn" data-number>9</button>
      <button class="btn operator" data-action="subtract">−</button>

      <button class="btn" data-number>4</button>
      <button class="btn" data-number>5</button>
      <button class="btn" data-number>6</button>
      <button class="btn operator" data-action="add">+</button>

      <button class="btn" data-number>1</button>
      <button class="btn" data-number>2</button>
      <button class="btn" data-number>3</button>
      <button class="btn span-two equals" data-action="equals">=</button>

      <button class="btn span-two" data-number>0</button>
      <button class="btn" data-number>.</button>
    </div>
  </div>
  <script
