name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: validate application
        run: echo "Validation successful"

  testing:
    runs-on: ubuntu-latest
    needs: validation
    steps:
      - name: test application
        run: echo "Testing successful"

  quality:
    runs-on: ubuntu-latest
    needs:
      - testing
      - validation
    steps:
      - name: test code quality
        run: echo "Code quality test successful"

  security:
    runs-on: ubuntu-latest
    needs: 
      - validation
      - quality
      - testing

    steps:
      - name: security vulnerabilities check
        run: echo "Security vulnerabilities check successful"

  packaging:
    needs: [ security, validation, quality, testing ]
    runs-on: ubuntu-latest
    steps:
      - name: package application
        run: echo "Packaging successful"
  
  deployment:
    runs-on: ubuntu-latest
    steps:
      - name: deploy application
        run: echo "Deployment successful"
      