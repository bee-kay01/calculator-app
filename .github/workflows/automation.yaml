name: CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      run-testing:
        description: 'Run Testing'
        required: true
        type: boolean

  push:
    branches:
      - main

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: validate application
        run: echo "Validation successful"

  testing:
    runs-on: ubuntu-latest
    needs: validation
    steps:
      - name: test application
        run: echo "Testing successful"

  quality:
    runs-on: ubuntu-latest
    needs: testing
    if: ${{ inputs.run-testing == true }}
    steps:
      - name: test code quality
        run: echo "Code quality test successful"

  security:
    runs-on: ubuntu-latest
    needs: testing
    if: success () || failure () || cancelled ()
    steps:
      - name: security vulnerabilities check
        run: echo "Security vulnerabilities check successful"

  packaging:
    needs: [quality, security]
    runs-on: ubuntu-latest
    steps:
      - name: package application
        run: echo "Packaging successful"

  deployment:
    runs-on: ubuntu-latest
    needs: packaging
    if: always()
    steps:
      - name: deploy application
        run: echo "Deployment successful"